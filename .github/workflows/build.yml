name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check public source boundary
        run: |
          python3 -B scripts/release_check_test.py
          python3 -B scripts/release_check.py --index

      - name: Set up Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '21'
          overwrite-settings: false

      - name: Validate Gradle wrapper
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          cache-disabled: true
          dependency-graph: disabled
          build-scan-publish: false
          validate-wrappers: true

      - name: Build and test
        run: ./gradlew --no-daemon --console=plain build

      - name: Check distributable contents
        run: python3 -B scripts/release_check.py --index --built-jar

      - name: Upload compiled mod and sources
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: blockblend-jars
          path: build/libs/blockblend-*.jar
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: false

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: blockblend-test-results
          path: |
            build/reports/tests/test/
            build/test-results/test/
          if-no-files-found: warn
          retention-days: 14
          include-hidden-files: false
